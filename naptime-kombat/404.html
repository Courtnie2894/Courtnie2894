<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="404. This page wandered off and a baby has it. Fight Naptime to get it back.">
<meta name="theme-color" content="#140b22">
<title>404 · Naptime Kombat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one 16-bit arcade screen on a 3 a.m. nursery wall, CRT scanlines over it, touch pad below on phones. One dark look by choice. */
:root{
  --bg:#140b22;
  --bg2:#2a1846;
  --fg:#fff4e6;
  --accent:#ffd23f;
  --accent2:#ff5c8a;
  --dim:#9a8fb3;
  --panel:#2a1b40;
  --line:#4e3a72;
  --ink:#1b1028;
  --font:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg2) 0%,var(--bg) 62%);background-color:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:100%;box-sizing:border-box;}
.wrap{width:100%;max-width:960px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0;}
.screen{position:relative;width:100%;max-width:960px;}
.screen canvas{width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#000;box-sizing:border-box;
  border:4px solid var(--line);box-shadow:0 0 0 4px #0c0616,0 18px 40px #000a;display:block;}
.screen::after{content:"";position:absolute;inset:4px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0.18) 0 1px,transparent 1px 3px);}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:9px;line-height:1.8;color:var(--dim);text-align:center;}
.bar b{color:var(--accent);font-weight:normal;}
.lost{margin:0;font-size:9px;line-height:2;color:var(--dim);text-align:center;}
.lost a{color:var(--accent);}
.lost a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.pad{display:none;width:100%;max-width:960px;gap:10px;justify-content:space-between;align-items:flex-end;}
.pad.on{display:flex;}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;}
.btns{display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:8px;}
.k{background:var(--panel);border:2px solid var(--line);color:var(--fg);font-family:var(--font);font-size:12px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;}
.k:active,.k.down{background:var(--accent);color:var(--ink);}
.k.pink{border-color:var(--accent2);}
.k.hide{visibility:hidden;}
.k:focus-visible{outline:3px solid var(--accent);}
button.k{cursor:pointer;}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <div class="screen"><canvas id="c" width="640" height="360" aria-label="Naptime Kombat, a bedtime fighting game"></canvas></div>
  <div class="bar">
    <span><b>&larr; &rarr;</b> crawl</span><span><b>&darr;</b> flatten</span><span><b>&uarr;</b> bounce</span>
    <span><b>Z</b> pat</span><span><b>X</b> bonk</span><span><b>S</b> block</span>
    <span><b>H</b> moves</span><span><b>M</b> sound</span><span><b>Enter</b> confirm</span>
  </div>
  <p class="lost" id="lost">404: this page wandered off and a baby has it. <a href="/">Take me home</a></p>
  <div class="pad" id="pad">
    <div class="dpad">
      <div class="k hide"></div><button class="k" data-k="ArrowUp">&#9650;</button><div class="k hide"></div>
      <button class="k" data-k="ArrowLeft">&#9664;</button><button class="k" data-k="Enter">OK</button><button class="k" data-k="ArrowRight">&#9654;</button>
      <div class="k hide"></div><button class="k" data-k="ArrowDown">&#9660;</button><div class="k hide"></div>
    </div>
    <div class="btns">
      <button class="k" data-k="KeyZ">PAT</button><button class="k pink" data-k="KeyX">BONK</button>
      <button class="k" data-k="KeyS">BLOCK</button><button class="k" data-k="KeyH">MOVES</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const W=320,H=180,FLOOR=150,OL='#1a0f22';
const cv=document.getElementById('c'); let ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOME_OK=(()=>{ try{ return window.top===window&&/^https?:$/.test(location.protocol); }catch(e){ return false; } })();
if(!HOME_OK){ const l=document.getElementById('lost'); if(l)l.hidden=true; }
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- audio ---------------- */
let AC=null,muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f,d,type,v,slide){ const a=ac(); if(!a||muted||!f)return; const o=a.createOscillator(),g=a.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),a.currentTime+d); g.gain.setValueAtTime(v||0.08,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+d); }
const tune=(notes,step,type,v)=>notes.forEach((n,i)=>setTimeout(()=>beep(n,step/1000*0.9,type||'triangle',v||0.05),i*step));
const SFX={
  pat:()=>beep(520,0.08,'square',0.07,260), bonk:()=>beep(160,0.18,'sawtooth',0.1,60), block:()=>beep(900,0.05,'triangle',0.05),
  jump:()=>beep(300,0.15,'square',0.05,700), hurt:()=>beep(220,0.2,'square',0.08,90), special:()=>{beep(700,0.1,'square',0.07,1400);setTimeout(()=>beep(1000,0.12,'square',0.06,500),90);},
  ko:()=>beep(110,0.5,'sawtooth',0.12,30), sel:()=>beep(880,0.06,'square',0.05), go:()=>{beep(440,0.1,'square',0.08);setTimeout(()=>beep(660,0.15,'square',0.08),120);},
  giggle:()=>tune([900,1050,1200],90,'triangle',0.05), waa:()=>beep(600,0.6,'sawtooth',0.07,200), burp:()=>beep(90,0.35,'sawtooth',0.12,45), ding:()=>beep(1320,0.3,'triangle',0.06),
  yawn:()=>beep(320,0.7,'sine',0.09,140), lullaby:()=>tune([659,587,523,587,659,659,659],170,'triangle',0.05), shhh:()=>beep(3000,0.4,'sawtooth',0.02,2000),
  snore:()=>tune([110,0,98,0,110],260,'sine',0.08)
};

/* ---------------- the babies (originals that only wink at the archetypes) ---------------- */
const ROSTER=[
 {id:'sniffles',name:'SNIFFLES',sub:'the ice kid',onesie:'#9fdcf5',skin:'#ffd9b8',hair:'#e8f6ff',tag:'Runny nose. Permanently. It freezes.',
  moves:[
   {name:'SNOTCICLE SHOT',seq:['B','B','F'],btn:'Z',kind:'proj',dmg:9,desc:'Sniffle-charged shot. Gross, not strong.'},
   {name:'COLD SHOULDER',seq:['D','D','U'],btn:'X',kind:'freeze',dmg:4,desc:'Refuses to share. Naptime freezes in disbelief.'},
   {name:'BRAIN FREEZE',seq:[],btn:'',kind:'passive',desc:'Eats every popsicle. Stuns himself. Never learns.'}]},
 {id:'ember',name:"LIL' EMBER",sub:'the fire-ninja kid',onesie:'#ff6a3d',skin:'#d9a070',hair:'#d9381e',tag:'On a monkey-backpack leash. Ate one hot chip.',
  moves:[
   {name:'MINE!',seq:['F','F','B'],btn:'Z',kind:'yank',dmg:7,desc:'Leash whip. Yanks Naptime over.'},
   {name:'SPICY BREATH',seq:['B','B','F'],btn:'X',kind:'flame',dmg:12,desc:'Breathes fire. Cries the whole time.'},
   {name:'NINJA VANISH',seq:['D','D','U'],btn:'Z',kind:'vanish',dmg:0,desc:'Hides behind the curtain. Feet visible.'}]},
 {id:'hugz',name:'BIG HUGZ',sub:'the four-armed kid',onesie:'#8be38b',skin:'#c68a5a',hair:'#2b1b12',tag:'Four arms. All of them sticky.',
  moves:[
   {name:'TANTRUM STOMP',seq:['D','D','U'],btn:'X',kind:'stomp',dmg:10,desc:'Floor flail. Hits harder the more unfair it feels.'},
   {name:'BONELESS',seq:['B','B','D'],btn:'Z',kind:'boneless',dmg:0,desc:'Goes full noodle. Takes half damage, can\'t be pushed.'},
   {name:'SNACK HEIST',seq:['F','F','F'],btn:'Z',kind:'heist',dmg:8,desc:'Grabs pillow, blankie, binky and one shoe.'}]},
 {id:'steve',name:'STATIC STEVE',sub:'the lightning kid',onesie:'#ffe066',skin:'#f0c4a8',hair:'#ffb703',tag:'Footie pajamas. Shuffles on carpet. Do not touch.',
  moves:[
   {name:'CARPET SHUFFLE',seq:[],btn:'',kind:'passive',desc:'Toddling or crawling builds static (the meter).'},
   {name:'ZAP BOOP',seq:['F','F','F'],btn:'X',kind:'zap',dmg:6,desc:'One finger. Dumps the whole meter.'},
   {name:'PEEKABOO',seq:['D','D','U'],btn:'Z',kind:'peekaboo',dmg:0,desc:'Covers eyes, becomes invisible. Reappears behind.'}]},
 {id:'shades',name:'SHADES',sub:'the sunglasses kid',onesie:'#c77dff',skin:'#8d5a3c',hair:'#1a1a1a',tag:'Sunglasses upside down. Arrived on a ride-on car.',
  moves:[
   {name:'THE SPLIT',seq:['D','D','D'],btn:'X',kind:'split',dmg:16,desc:'Showboat split. Needs a parent to get up.'},
   {name:'PAPARAZZI GRANDMA',seq:['B','B','F'],btn:'Z',kind:'flash',dmg:3,desc:'Grandma\'s phone flash. Naptime is dazzled.'},
   {name:'MIRROR CHECK',seq:[],btn:'',kind:'passive',desc:'After 3 hits he admires himself. Real weakness.'}]}
];
const STYLE={sniffles:{trim:'#2f6fb5',fist:'#c8eefb',foot:'#2f6fb5'},ember:{trim:'#ffd23f',fist:'#c0392b',foot:'#3a1a0a'},
  hugz:{trim:'#2f7a2f',foot:'#f4f4f4'},steve:{trim:'#fff4c8',foot:'pj'},shades:{trim:'#ffd700',foot:'#f4f4f4'}};
const NAP={id:'naptime',name:'NAPTIME'};
const WHOOPSIE={
 sniffles:['Sneezes Naptime into an ice sculpture.','Admires it. Licks it.','TONGUE STUCK.'],
 ember:['Winds up a GIANT fireball...','One birthday-candle flame comes out.','Everyone sings. Naptime blows it out.'],
 hugz:['Sits on Naptime.','A long pause.','*wet sound*  ...fade to changing table.'],
 steve:['ZAP! Naptime puffs into a static cloud.','Party balloons stick to it.','It slowly floats off-screen.'],
 shades:['Signs an autograph on Naptime.','In permanent marker.','A mom gasp plays off-screen.']
};
const MOM_LINES=['HEY. WE DO NOT HIT.','USE YOUR WORDS.','IT IS NAPTIME. I AM NOT ASKING.','WHO HAS A STINKY?','GENTLE HANDS.','NOBODY IS TIRED? OKAY.','IS THAT A LEGO ON THE FLOOR?'];
const WAKE=['WOKE UP. DIAPER.','THE DOG BARKED.','WOKE UP FOR NO REASON.','MOM TRIED THE CRIB TRANSFER.','WOKE UP SCREAMING. FEELS GREAT.','A LEAF BLOWER, THREE HOUSES DOWN.','DREAMED OF SNACKS.'];
const WORDS=['ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN'];
const BOOKS=['GOODNIGHT, 404','GO THE FUDGE TO SLEEP',"DON'T LET THE BABY STAY UP LATE",'GUESS HOW MUCH I NEED A NAP','THE VERY SLEEPY TODDLER','WHERE THE WILD BABIES NAP','LLAMA LLAMA NAP DRAMA','IF YOU GIVE A BABY A BOTTLE','THE GOING-TO-BED BOOK. AGAIN.'];
const EXCUSES=["BUT I'M NOT EVEN TIRED!",'JUST ONE MORE BOOK.','I NEED A GLASS OF WATER.','FIVE MORE MINUTES. PLEASE?',"I'LL BE SO GOOD. I PROMISE.",'MY BLANKIE IS NOT TIRED EITHER.','WHAT IF I JUST LIE HERE AWAKE?'];
const GOODNIGHT=['GOODNIGHT, AWAKE BAR.','GOODNIGHT, LEGO ON THE FLOOR.','GOODNIGHT, DOG. YOU ATE A SHOE.','GOODNIGHT, SNACK TIMER.','GOODNIGHT, BROKEN LINK.','GOODNIGHT, PAGE 404.','GOODNIGHT, MOON.'];
const RETREAT=['NAPTIME WAITS OUT ONE MORE BOOK.','NAPTIME RETREATS TO THE HALLWAY.','NAPTIME HIDES IN THE LAUNDRY.','NAPTIME GOES TO WARM UP MORE MILK.','NAPTIME REGROUPS UNDER THE CRIB.'];
const AFTER=['Fell asleep in the car seat 4 minutes later.','Fell asleep face-down in the mac and cheese.','Fell asleep standing up. Still counts.','Fell asleep on the dog. Dog is fine.'];

/* ---------------- input ---------------- */
const keys={},pressed={};
const padEl=document.getElementById('pad');
function kdown(code){ if(!keys[code])pressed[code]=true; keys[code]=true; ac(); }
function kup(code){ keys[code]=false; }
addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault(); if(e.code==='KeyM'&&!e.repeat)muted=!muted; if(!e.repeat)kdown(e.code); });
addEventListener('keyup',e=>kup(e.code));
padEl.querySelectorAll('button[data-k]').forEach(b=>{
  const code=b.dataset.k;
  const on=e=>{e.preventDefault();b.classList.add('down');kdown(code);};
  const off=e=>{e.preventDefault();b.classList.remove('down');kup(code);};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});
addEventListener('touchstart',()=>padEl.classList.add('on'),{passive:true,once:true});
if(matchMedia('(pointer:coarse)').matches)padEl.classList.add('on');

/* ---------------- state ---------------- */
const MOS=480;
const G={prevScene:'title',mos:0,camS:0,scene:'title',t:0,diff:'easy',sel:0,fighters:[],projs:[],drops:[],fx:[],timer:60,attempt:0,delays:0,clock:780,startClock:780,msg:[],shake:0,
  lego:null,item:null,dog:null,menuIdx:0,showMoves:false,whoop:null,mom:null,momT:0,spotless:false,delay:null,after:'',phase:'intro'};
function say(text,ms,color,big,keep){ if(G.scene==='fight'&&!big&&!keep)return; G.msg.push({text,ms,color:color||'#fff4e6',big:!!big}); }
function fmtClock(m){ m=Math.round(m); let h=Math.floor(m/60)%24; const mm=String(m%60).padStart(2,'0'); const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+mm+' '+ap; }
function makeFighter(ch,x,facing,isBoss){
  return {ch,x,y:FLOOR,vx:0,vy:0,facing,isBoss,hw:isBoss?18:8,hp:100,maxHp:100,state:'idle',st:0,atk:null,hitDone:false,stun:0,block:false,crouch:false,
    meter:0,buf:[],invis:0,boneless:0,stuck:0,hitCount:0,mirror:0,frozen:0,dazzle:0,crying:0,drowsy:0,anim:0,dmgTaken:0,cool:1500,milks:0,want:70,trail:[],sleepT:3000,stage:0,stare:0,rub:0,fussy:0,silly:0,blinkEyes:0,sleepy:0};
}

/* ---------------- run / attempts ---------------- */
function startRun(){ G.attempt=0; G.delays=0; G.clock=13*60; G.startClock=G.clock; startAttempt(); }
function startAttempt(){
  G.attempt++;
  const p=makeFighter(ROSTER[G.sel],80,1,false), n=makeFighter(NAP,240,-1,true);
  const base=G.diff==='easy'?130:170, k=G.delays;
  p.maxHp=Math.max(25,Math.round(100*(1-0.2*k))); p.hp=p.maxHp;
  n.energy=k; n.maxHp=Math.round(base*(1+0.25*k)); n.hp=n.maxHp;
  G.fighters=[p,n]; G.projs=[]; G.drops=[]; G.fx=[]; G.timer=60; G.lego=null; G.item=null; G.dog=null; G.msg=[]; G.mom=null; G.spotless=false; G.blink=null;
  G.scene='fight'; G.phase='intro';
  const a=G.attempt, tok=G.attempt;
  say('ROUND '+(WORDS[a-1]||a),1100,'#ffd23f',true);
  setTimeout(()=>{ if(G.scene==='fight'&&G.attempt===tok)say(a>=3?'GO THE FUDGE TO SLEEP.':'PLAY NICE.',a>=3?1300:900,'#ff5c8a',true); },1150);
  if(a>1)setTimeout(()=>{ if(G.scene==='fight'&&G.attempt===tok)say('NAPTIME IS BACK. WELL RESTED.',1000,'#c3b6ff'); },1300);
  setTimeout(()=>{ if(G.scene==='fight'&&G.attempt===tok&&G.phase==='intro'){G.phase='play';SFX.go();} },2100);
}
function endAttempt(res){
  if(G.phase!=='play')return;
  G.phase='roundend';
  const p=G.fighters[0], n=G.fighters[1], tok=G.attempt;
  if(res==='win'||res==='snackwin'){
    if(res==='snackwin'){ say('SNACK TIME',1200,'#ffd23f',true); say('SNACK BEATS NAP. FOR NOW.',1600,'#fff4e6',false,true); n.state='ko'; }
    else say('NAPTIME DOWN!',1300,'#ffd23f',true);
    if(p.dmgTaken===0){ G.spotless=true; setTimeout(()=>{ if(G.scene==='fight')say('SPOTLESS. NO MESS.',1000,'#9fdcf5',true); },1300); }
    setTimeout(()=>{ if(G.scene==='fight'&&G.attempt===tok)startWhoopsie(); },2700);
  } else {
    if(res==='snacklose'){ say('SNACK TIME',1200,'#ffd23f',true); say('FELL ASLEEP MID-BITE.',1500,'#c3b6ff',false,true); }
    else say('EYES... CLOSING...',1400,'#c3b6ff',true);
    p.state='ko'; p.st=0; p.vx=0; SFX.snore();
    setTimeout(()=>{ if(G.scene==='fight'&&G.attempt===tok)startSandman(); },2300);
  }
}
function startDelay(){
  G.delays++; const mins=rnd([20,35,45,60]);
  G.delay={from:G.clock,to:G.clock+mins,mins,reason:rnd(RETREAT),excuse:rnd(EXCUSES),t:0};
  G.clock+=mins; G.scene='delay'; G.msg=[]; SFX.go();
}
function startSandman(){
  G.scene='sandman'; G.msg=[]; G.projs=[]; G.drops=[]; G.sand={t:0,grains:[]};
  const n=G.fighters[1]; if(n.state!=='ko'){ n.state='idle'; n.frozen=0; n.dazzle=0; }
  SFX.lullaby(); setTimeout(()=>{ if(G.scene==='sandman')SFX.lullaby(); },1400);
  try{ const prev=+(localStorage.getItem('nk-best')||0); G.best=Math.max(prev,G.delays); G.newBest=G.delays>prev; localStorage.setItem('nk-best',String(G.best)); }
  catch(e){ G.best=G.delays; G.newBest=false; }
}
function sandPos(t){ const p=G.fighters[0], k=Math.min(1,t/2500), e=1-Math.pow(1-k,3), tx=Math.min(W-34,p.x+36); let x=W+50+(tx-(W+50))*e, y=30+74*e+Math.sin(G.t/500)*2.5; if(t>5200){ const k2=Math.min(1,(t-5200)/1600), e2=k2*k2; x+=(W+90-x)*e2; y-=150*e2; } return {x,y}; }
function updateSandman(dt){
  const s=G.sand; s.t+=dt; const pos=sandPos(s.t);
  if(s.t>2600&&s.t<5200&&Math.random()<0.55)s.grains.push({x:pos.x-33+Math.random()*2,y:pos.y-56,vx:-0.15-Math.random()*0.25,vy:0});
  for(const g of s.grains){ g.vy+=0.02; g.x+=g.vx; g.y+=g.vy; }
  s.grains=s.grains.filter(g=>g.y<FLOOR-2);
  for(const f of G.fighters)f.anim+=dt;
  if(s.t>10500)startGoodnight();
}
function startGoodnight(){ G.scene='goodnight'; G.gn={t:0}; SFX.lullaby();
}

/* ---------------- moves & combos ---------------- */
function pushDir(f,d){ f.buf.push({d,t:G.t}); if(f.buf.length>8)f.buf.shift(); }
function matchSeq(f,seq){
  const b=f.buf; if(!seq.length||b.length<seq.length)return false;
  const tail=b.slice(-seq.length);
  if(G.t-tail[tail.length-1].t>700)return false;
  for(let i=1;i<tail.length;i++)if(tail[i].t-tail[i-1].t>600)return false;
  return tail.every((e,i)=>e.d===seq[i]);
}
function relDir(f,dir){ if(dir==='L')return f.facing===-1?'F':'B'; if(dir==='R')return f.facing===1?'F':'B'; return dir; }
function seqStr(seq,facing){ return seq.map(d=>d==='D'?'DN':d==='U'?'UP':((d==='F')===(facing===1)?'->':'<-')).join(' '); }
function tryMoves(f,btn){ for(const m of f.ch.moves){ if(m.btn===btn&&matchSeq(f,m.seq)){ doSpecial(f,m); f.buf=[]; return true; } } return false; }
function startAttack(f,kind){
  f.state='attack';f.st=0;f.hitDone=false;
  if(kind==='light'&&f.crouch){ f.atk={name:'nibble',start:5,active:6,rec:10,dmg:5,reach:18,kb:1}; SFX.pat(); return; }
  if(kind==='light'){ f.atk={name:'pat',start:4,active:6,rec:8,dmg:5,reach:22,kb:1.5}; SFX.pat(); return; }
  f.crouch=false; f.atk={name:'bonk',start:9,active:6,rec:14,dmg:10,reach:26,kb:3}; SFX.bonk();
}
function other(f){ return G.fighters[0]===f?G.fighters[1]:G.fighters[0]; }
function doSpecial(f,m){
  const o=other(f), dist=Math.abs(o.x-f.x); SFX.special();
  f.state='special';f.st=0;f.atk=null;f.special=m;f.hitDone=false;
  say(m.name,700,'#ffd23f',false,true);
  switch(m.kind){
    case 'proj': G.projs.push({x:f.x+f.facing*24,y:f.y-20,vx:f.facing*2.2,owner:f,dmg:m.dmg,kind:'snot',life:200}); f.specialLen=16; break;
    case 'freeze': f.specialLen=22; if(dist<30+o.hw){ hurt(o,f,m.dmg,0,'freeze'); if(o.hp>0){ o.frozen=1500; o.state='stun'; o.st=0; o.stun=0; say('...IN DISBELIEF',700,'#9fdcf5'); } } break;

    case 'vanish': f.specialLen=10; f.invis=1500; break;
    case 'stomp': { f.specialLen=28; const unfair=1+(100-f.hp)/100; G.shake=12; if(dist<55+o.hw)hurt(o,f,Math.round(m.dmg*unfair),2,'stomp'); say(unfair>1.5?'SO UNFAIR!!':'NOT FAIR!',700,'#8be38b'); break; }
    case 'boneless': f.specialLen=8; f.boneless=2000; break;
    case 'heist': f.specialLen=24; f.vx=f.facing*4; f.heist=true; break;
    case 'zap': { f.specialLen=18; const d=m.dmg+Math.round(f.meter/5); if(dist<26+o.hw){ hurt(o,f,d,2,'zap'); say(f.meter>60?'ZAP BOOP!!!':'zap boop.',600,'#ffe066'); } else say('boop.',500,'#ffe066'); f.meter=0; break; }
    case 'peekaboo': f.specialLen=20; f.invis=900; f.teleport=12; break;
    case 'split': f.specialLen=20; if(dist<30+o.hw)hurt(o,f,m.dmg,3,'split'); f.stuckAfter=1500; break;
    case 'flash': f.specialLen=16; o.dazzle=1400; hurt(o,f,m.dmg,0,'flash'); G.fx.push({kind:'flash',t:0}); say('SAY CHEESE',600,'#fff'); break;

function hurt(v,by,dmg,kb,src){
  if(v.hp<=0)return 'miss';
  if(v.invis>0&&src!=='stomp'){ say('MISSED. HE\'S "INVISIBLE".',600,'#8f84a6'); return 'miss'; }
  if(v.block&&v.state!=='stun'&&!['heist','yank','flash'].includes(src)){
    const d=Math.max(1,Math.round(dmg*0.2)); v.hp=Math.max(1,v.hp-d); SFX.block(); G.fx.push({kind:'spark',x:v.x,y:v.y-30,t:0}); v.vx=(by.x<v.x?1:-1)*1; return 'block';
  }
  let d=dmg; if(v.boneless){ d=Math.round(dmg*0.5); kb=0; }
  v.hp-=d; v.dmgTaken+=d; SFX.hurt();
  const big=src==='stomp'||src==='split'||src==='blanket';
  if(v.isBoss){ if(v.state!=='cast'||big||d>=10){ v.state='stun'; v.st=0; v.stun=big?650:240; } v.vx=(by.x<v.x?1:-1)*kb*0.4; }
  else { v.state='stun'; v.st=0; v.stun=Math.max(v.stun||0,big?650:260); v.vx=(by.x<v.x?1:-1)*kb; v.atk=null; v.special=null; v.heist=false; }
  G.fx.push({kind:'pow',x:v.x,y:v.y-(v.isBoss?56:46),t:0,text:v.isBoss?rnd(['OOF','HMPH','NO','*YAWN*','RUDE']):rnd(['OW','WAA','BONK','OOF','NO'])});
  if(!by.isBoss){ by.hitCount++; if(by.ch.id==='shades'&&by.hitCount>=3){ by.hitCount=0; by.mirror=1100; by.state='stun'; by.st=0; by.stun=1100; by.special=null; say('MIRROR CHECK...',900,'#c77dff'); } }
  if(v.hp<=0){ v.hp=0; v.state='ko'; v.st=0; SFX.ko(); }
  if(d>=8&&Math.random()<0.5)momSays();
  return 'hit';
}
function momSays(){ if(G.scene==='fight'||G.momT>0)return; G.mom=rnd(MOM_LINES); G.momT=1600; }
function grav(f){ if(f.y<FLOOR||f.vy<0){ f.vy+=0.22; f.y+=f.vy; if(f.y>=FLOOR){f.y=FLOOR;f.vy=0;} } }

/* ---------------- player ---------------- */
function updatePlayer(f,dt,inp){
  const o=G.fighters[1];
  f.anim+=dt;
  for(const k of ['invis','boneless','stuck','frozen','dazzle','crying','mirror','drowsy','stare','rub','fussy','silly','blinkEyes'])if(f[k]>0)f[k]=Math.max(0,f[k]-dt);
  if(inp.leftP)pushDir(f,relDir(f,'L')); if(inp.rightP)pushDir(f,relDir(f,'R')); if(inp.downP)pushDir(f,'D'); if(inp.upP)pushDir(f,'U');
  if(inp.leftP||inp.rightP||inp.downP||inp.upP||inp.zP||inp.xP){ f.trail=f.trail.concat([{k:inp.zP?'Z':inp.xP?'X':inp.upP?'UP':inp.downP?'DN':inp.leftP?'<-':'->',t:G.t}]).slice(-6); }
  if(f.state==='ko'){ f.st+=dt; f.x+=f.vx; f.vx*=0.9; grav(f); return; }
  if(f.state==='stun'){ f.st+=dt; f.x+=f.vx; f.vx*=0.85; if(f.frozen>0||f.mirror>0)f.vx=0; else if(f.st>=f.stun){f.state='idle';f.stun=0;} f.block=false; grav(f); return; }
  if(f.stuck>0){ f.state='idle'; f.vx=0; f.crouch=false; return; }
  if(f.state!=='attack'&&f.state!=='special'&&f.y>=FLOOR)f.facing=o.x>=f.x?1:-1;
  if(f.state==='special'){
    f.st++; f.x+=f.vx; f.vx*=0.9;
    if(f.heist&&Math.abs(o.x-f.x)<14+o.hw&&!f.hitDone){ f.hitDone=true; hurt(o,f,8,2,'heist'); f.hp=Math.min(f.maxHp,f.hp+6); }
    if(f.teleport>0){ f.teleport--; if(f.teleport===0){ f.x=Math.max(12,Math.min(W-12,o.x-o.facing*(16+o.hw))); f.facing=o.x>=f.x?1:-1; } }
    if(f.st>=f.specialLen){ f.state='idle'; f.heist=false; f.vx=0; f.special=null; if(f.stuckAfter){f.stuck=f.stuckAfter;f.stuckAfter=0;} }
    return;
  }
  if(f.state==='attack'){
    const a=f.atk; f.st++;
    if(f.st>a.start&&f.st<=a.start+a.active&&!f.hitDone){
      const hx=f.x+f.facing*(10+a.reach/2);
      if(Math.abs(o.x-hx)<a.reach/2+o.hw&&o.hp>0){ f.hitDone=true; hurt(o,f,a.dmg,a.kb,a.name); }
    }
    if(f.st>=a.start+a.active+a.rec){ f.state=f.crouch?'flat':'idle'; f.atk=null; }
    f.x+=f.vx; f.vx*=0.8; grav(f); return;
  }
  // sleepy episodes get more frequent and stranger as AWAKE drains
  if(f.stage>0){ f.sleepT-=dt; if(f.sleepT<=0){
    const sl=f.sleepy||0, opts=[['blink',3],['stare',2]];
    if(f.stage>=2)opts.push(['rub',3]); if(f.stage>=3)opts.push(['fussy',3]); if(f.stage>=4)opts.push(['silly',3]);
    const tot=opts.reduce((a,x)=>a+x[1],0); let r=Math.random()*tot, pick='blink';
    for(const x of opts){ r-=x[1]; if(r<=0){pick=x[0];break;} }
    if(pick==='blink'){ const len=450+600*sl; G.blink={t:0,len}; f.blinkEyes=len; }
    else if(pick==='stare')f.stare=600+700*sl;
    else if(pick==='rub')f.rub=900;
    else if(pick==='fussy'){ f.fussy=1000; SFX.waa(); }
    else { f.silly=2400; SFX.giggle(); }
    f.sleepT=(4200-2400*sl)+Math.random()*1800;
  } }
  if(f.stare>0||f.rub>0||f.fussy>0){ f.vx=0; f.block=false; f.crouch=false; f.state='idle'; grav(f); return; }
  f.block=!!inp.block&&f.y>=FLOOR;
  f.crouch=!!inp.down&&f.y>=FLOOR&&!f.block;
  let mv=0; if(!f.block){ if(inp.left)mv=-1; if(inp.right)mv=1; }
  if(f.dazzle>0)mv=-mv;
  if(f.silly>0&&Math.sin(G.t/350)>0)mv=-mv;
  let spd=f.boneless?0.6:f.crouch?0.35:1.0; spd*=1-0.45*(f.sleepy||0); if(f.drowsy>0)spd*=0.55;
  f.vx=mv*spd;
  if(f.y>=FLOOR){ f.state=f.crouch?'flat':(mv!==0?'crawl':'idle'); if(mv!==0&&!f.crouch&&f.ch.id==='steve')f.meter=Math.min(100,f.meter+dt*0.03); }
  if(inp.jumpP&&f.y>=FLOOR&&!f.block&&!f.boneless&&!f.crouch){ f.vy=-3.8; SFX.jump(); }
  if(f.y>=FLOOR&&!f.block&&!f.boneless){
    if(inp.zP){ if(!tryMoves(f,'Z'))startAttack(f,'light'); }
    else if(inp.xP){ if(!tryMoves(f,'X'))startAttack(f,'heavy'); }
  }
  f.x+=f.vx; grav(f);
}

/* ---------------- NAPTIME, the only opponent ---------------- */
function updateNap(n,dt){
  const p=G.fighters[0], hard=G.diff==='hard', en=n.energy||0;
  n.anim+=dt;
  n.emoteT=(n.emoteT||2200)-dt; if(n.emoteT<=0&&n.state==='idle'){ n.emote=rnd(['brow','smile','hum','smile','brow']); n.emoteAt=G.t; n.emoteLen=n.emote==='hum'?1800:1100; n.emoteT=2500+Math.random()*3000; }
  for(const k of ['frozen','dazzle'])if(n[k]>0)n[k]=Math.max(0,n[k]-dt);
  if(n.state==='ko'){ n.st+=dt; return; }
  if(n.state==='stun'){ n.st+=dt; n.x+=n.vx; n.vx*=0.85; if(n.frozen<=0&&n.st>=n.stun)n.state='idle'; return; }
  if(n.frozen>0)return;
  n.facing=p.x>=n.x?1:-1;
  if(n.state==='cast'){ n.st+=dt; if(!n.fired&&n.st>=n.castWind){ n.fired=true; fireNap(n,p); } if(n.st>=n.castLen)n.state='idle'; return; }
  const dist=Math.abs(p.x-n.x), spd=(hard?0.75:0.5)*(1+0.1*en);
  let mv=0;
  if(n.dazzle>0)mv=Math.sin(G.t/300); else if(dist>n.want+10)mv=Math.sign(p.x-n.x); else if(dist<n.want-20)mv=-Math.sign(p.x-n.x);
  n.x+=mv*spd;
  n.cool-=dt;
  if(n.cool<=0&&n.dazzle<=0&&p.hp>0){
    const opts=[['yawn',3],['lullaby',2],['blanket',hard?3:1.4],['story',hard?2:1.6]];
    if(dist<48)opts.push(['shhh',hard?4:2.5]);
    if(n.hp<n.maxHp*0.5&&n.milks<(hard?3:2))opts.push(['milk',2]);
    const tot=opts.reduce((s,o)=>s+o[1],0); let r=Math.random()*tot,pick=opts[0][0];
    for(const o of opts){ r-=o[1]; if(r<=0){pick=o[0];break;} }
    startCast(n,pick,p);
    n.cool=(hard?750+Math.random()*500:1300+Math.random()*800)*Math.max(0.55,1-0.12*en);
    n.want=40+Math.random()*60;
  }
}
function startCast(n,name,p){

  n.state='cast'; n.st=0; n.fired=false; n.cast=name; n.castWind=wind; n.castLen=wind+420;
  say({yawn:'BIG YAWN',lullaby:'LULLABY',blanket:'WEIGHTED BLANKET',shhh:'SHHHHHH',milk:'WARM MILK',story:'BEDTIME STORY'}[name],700,'#c3b6ff');
  if(name==='blanket')G.drops.push({x:p.x,t:0,fall:G.diff==='hard'?750:1000,done:false});
}

function updateDrops(dt){

/* ---------------- projectiles ---------------- */
function updateProjs(){
  const p=G.fighters[0];
  for(const q of G.projs){
    q.x+=q.vx; q.life--;
    if(q.kind==='book')q.y=q.by+Math.sin(q.life/7)*3;
    if(q.kind==='note'){ q.vy+=0.22; q.y+=q.vy; if(q.y>FLOOR-5){ q.y=FLOOR-5; q.vy=-2.4; } }
    const t=other(q.owner);
    if(q.hit||t.hp<=0)continue;
    if(Math.abs(q.x-t.x)<(q.w||8)/2+t.hw){
      if(t===p){
        const low=t.crouch||t.state==='flat';
        if((q.kind==='yawn'||q.kind==='book')&&low)continue;
        if(q.kind==='note'&&t.y<FLOOR-9)continue;
        if((q.kind==='yawn'||q.kind==='book')&&t.y<FLOOR-28)continue;
      }
      q.hit=true; q.life=Math.min(q.life,4);
      const r=hurt(t,q.owner,q.dmg,q.kind==='flame'?0.5:1.5,q.kind);
      if(q.kind==='snot'&&r==='hit')say('EW.',400,'#9fdcf5');
      if((q.kind==='yawn'||q.kind==='book')&&r==='hit'){ t.drowsy=2000; say('SO... SLEEPY...',800,'#c3b6ff'); }
    }
  }
  G.projs=G.projs.filter(q=>q.life>0&&q.x>-20&&q.x<W+20);
}

/* ---------------- Whoopsie ---------------- */
const BIGKID=['D','D','U','U','X'];
function startWhoopsie(){ G.scene='whoopsie'; G.msg=[]; G.whoop={phase:'prompt',t:0,input:[],result:null,lines:[],line:0}; SFX.burp(); }
function updateWhoopsie(dt,P){
  const w=G.whoop,f=G.fighters[0]; w.t+=dt;
  if(w.phase==='prompt'){
    if(P.down)w.input.push('D'); if(P.up)w.input.push('U'); if(P.left)w.input.push('<-'); if(P.right)w.input.push('->'); if(P.x)w.input.push('X'); if(P.z)w.input.push('Z');
    if(w.input.length>5)w.input.shift();

    if(done||w.t>4500){

    if(w.t>1300&&w.line<w.lines.length-1){ w.line++; w.t=0; if(w.result==='whoopsie'&&w.line===1)SFX.waa(); }
    else if(w.t>1800&&w.line>=w.lines.length-1){ startDelay(); }
  }
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last); last=now; G.t+=dt;
  const P={up:!!pressed.ArrowUp,down:!!pressed.ArrowDown,left:!!pressed.ArrowLeft,right:!!pressed.ArrowRight,z:!!pressed.KeyZ,x:!!pressed.KeyX,enter:!!pressed.Enter||!!pressed.Space,h:!!pressed.KeyH,esc:!!pressed.Escape};
  if(P.h&&G.scene==='fight')G.showMoves=!G.showMoves;
  if(G.scene==='title'){ if(P.enter||P.z||P.x){G.scene='diff';G.menuIdx=0;SFX.sel();} }
  else if(G.scene==='diff'){ if(P.up||P.down){G.menuIdx=1-G.menuIdx;SFX.sel();} if(P.enter||P.z||P.x){G.diff=G.menuIdx===0?'easy':'hard';G.scene='select';SFX.go();} if(P.esc)G.scene='title'; }
  else if(G.scene==='select'){ if(P.left){G.sel=(G.sel+4)%5;SFX.sel();} if(P.right){G.sel=(G.sel+1)%5;SFX.sel();} if(P.enter||P.z||P.x){ SFX.go(); startRun(); } if(P.esc)G.scene='diff'; }
  else if(G.scene==='fight'){
    if(G.momT>0){G.momT-=dt;if(G.momT<=0)G.mom=null;}
    if(G.blink){ G.blink.t+=dt; if(G.blink.t>=G.blink.len)G.blink=null; }
    const [p,n]=G.fighters;
    if(G.phase==='play'&&!G.showMoves){
      const pi={left:!!keys.ArrowLeft,right:!!keys.ArrowRight,down:!!keys.ArrowDown,block:!!keys.KeyS,jumpP:P.up,upP:P.up,leftP:P.left,rightP:P.right,downP:P.down,zP:P.z,xP:P.x};
      updatePlayer(p,dt,pi); updateNap(n,dt); updateDrops(dt);
      p.x=Math.max(12,Math.min(W-12,p.x)); n.x=Math.max(26,Math.min(W-26,n.x));
      const minD=p.hw+n.hw-2, d=p.x-n.x;
      if(Math.abs(d)<minD&&p.y>FLOOR-30){ const s=Math.sign(d)||-n.facing; const want=n.x+s*minD; const cl=Math.max(12,Math.min(W-12,want)); p.x=cl; if(cl!==want)n.x-=(want-cl); }
      updateProjs(); updateUhOhs(dt);
      for(const f of G.fighters){ if(f.lag===undefined||f.lag<f.hp)f.lag=f.hp; else f.lag=Math.max(f.hp,f.lag-dt*0.03); }
      if(p.hp>0)p.hp=Math.max(0,p.hp-dt/1000*((G.diff==='easy'?0.35:0.5)+0.25*G.delays));
      p.sleepy=Math.max(0,Math.min(1,1-p.hp/100));

  px(0,0,W,H,'rgba(5,2,12,'+Math.min(0.7,t/9000*0.85)+')');
  const pos=sandPos(t); drawSandman(pos.x,pos.y);
  for(const g of s.grains)px(g.x,g.y,1,1,(g.x*7|0)%2?'#ffd98a':'#fff4c8');
  if(t>600)gtext('THE SANDMAN',160,14,12,'center','#ffd98a');
  if(t>2800)otext('a pinch of sleepy sand...',160,30,'#fff4e6',6,'center');
  if(t>6400)gtext('NAPTIME WINS.',160,66,14,'center','#c3b6ff');
  if(t>7400)otext('IT ALWAYS DOES.',160,88,'#fff4e6',7,'center');
  if(t>8000){ px(0,H-14,W,14,'rgba(0,0,0,0.65)'); text('MOM (off-screen): ...FINALLY.',160,H-11,'#ff5c8a',6,'center'); }
  if(t>2500&&t<8000)text('ENTER to skip',300,6,'#8f84a6',5,'right');
}
function drawWhoopsie(){
  drawStage(); const w=G.whoop;
  drawNap(G.fighters[1]); drawBaby(G.fighters[0]); drawFx();
  px(0,0,W,H,'rgba(0,0,0,0.45)');
  if(w.phase==='prompt'){
    gtext('BURP HIM.',160,34,18,'center','#ff5c8a');
    otext('BIG KID MOVE: DN DN UP UP X',160,64,'#ffd23f',8,'center');
    text('you have '+Math.max(0,Math.ceil((4500-w.t)/1000))+'s. babies have no motor control.',160,78,'#8f84a6',5,'center');
    otext(w.input.map(s=>({D:'DN',U:'UP'})[s]||s).join(' '),160,94,'#fff4e6',10,'center');
  } else {
    const L=w.lines; gtext(L[0],160,30,L[0].length>12?10:16,'center',w.result==='bigkid'?'#ffd23f':'#ff5c8a');
    for(let i=1;i<=w.line;i++)otext(L[i],160,56+i*14,'#fff4e6',6,'center');
  }
}
function drawGoodnight(){
  const t=G.gn.t;
  drawStage(); px(0,0,W,H,'rgba(6,3,14,0.8)');
  const g=ctx.createRadialGradient(160,60,10,160,60,150); g.addColorStop(0,'rgba(200,216,255,0.08)'); g.addColorStop(1,'rgba(200,216,255,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawBaby(Object.assign(dummy(G.fighters[0].ch,70,1),{state:'ko'}));
  drawNap({x:256,facing:-1,state:'ko',anim:G.t});
  const shown=Math.min(GOODNIGHT.length,Math.floor(t/700)+1);
  for(let i=0;i<shown;i++){ const last=i===GOODNIGHT.length-1; otext(GOODNIGHT[i],160,14+i*13,last?'#ffd98a':(i%2?'#c3b6ff':'#fff4e6'),6,'center'); }
  if(t>GOODNIGHT.length*700+600){ gtext('GOODNIGHT, MOM.',160,110,12,'center','#ffd23f'); }
  if(t>GOODNIGHT.length*700+1700)otext('MOM: GOODNIGHT. NOBODY MOVE.',160,130,'#ff5c8a',6,'center');
  if(t>1200)text('ENTER to skip',316,4,'#8f84a6',5,'right');
}
function drawResult(){
  drawStage(); px(0,0,W,H,'rgba(8,4,16,0.9)');
  gtext('NAPTIME WINS',160,14,16,'center','#c3b6ff');
  gtext('ERROR 404: BABY ASLEEP',160,40,8,'center','#ffd23f');
  text('Stayed up until '+fmtClock(G.clock)+'.',160,56,'#fff4e6',6,'center');
  text(G.delays?('Delayed Naptime '+G.delays+(G.delays===1?' time.':' times.')):'Did not delay Naptime once. Respect.',160,66,'#fff4e6',6,'center');
  const nb=G.newBest&&G.delays>0; text(nb?'NEW PERSONAL BEST':'Personal best: '+(G.best||0)+(G.best===1?' delay':' delays'),160,76,nb?'#ffd23f':'#8f84a6',5,'center');
  text('This page is napping. Please come back later.',160,88,'#8f84a6',5,'center');
  const opts=HOME_OK?['TRY AGAIN','PICK ANOTHER BABY','TAKE ME HOME']:['TRY AGAIN','PICK ANOTHER BABY'];
  opts.forEach((o,i)=>{ const sel=G.menuIdx===i, y=104+i*14; if(sel)gtext('> '+o,160,y,8,'center','#ff5c8a'); else otext(o,160,y,'#fff4e6',8,'center'); });
  drawBaby(Object.assign(dummy(G.fighters[0].ch,166,1),{state:'ko',y:170}));
}
let lastFilter='';
function applyFilter(){
  let sl=0; if(G.scene==='fight'&&G.fighters[0])sl=G.fighters[0].sleepy||0; else if(G.scene==='sandman')sl=0.5;
  const fs=sl>0.02?'grayscale('+(Math.round(Math.min(0.9,sl)*20)/20)+') brightness('+(Math.round((1-0.3*sl)*20)/20)+')':'none';
  if(fs!==lastFilter){ cv.style.filter=fs==='none'?'':fs; lastFilter=fs; }
}
function drawVignette(){ const sl=G.fighters[0].sleepy||0; if(sl<=0.05)return; const g=ctx.createRadialGradient(160,95,40,160,95,200); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+(0.75*sl)+')'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
function drawBlink(){ const b=G.blink; if(!b)return; const k=b.t<120?b.t/120:(b.t>b.len-160?Math.max(0,(b.len-b.t)/160):1); const lid=k*H/2; px(0,0,W,lid,'#05020c'); px(0,H-lid,W,lid,'#05020c'); }
function draw(){
  applyFilter();
  ctx.setTransform(2,0,0,2,0,0);
  ctx.save();
  if(G.shake>0)ctx.translate(q2((Math.random()-0.5)*4),q2((Math.random()-0.5)*4));
  if(G.scene==='title')drawTitle();
  else if(G.scene==='diff')drawDiff();
  else if(G.scene==='select')drawSelect();
  else if(G.scene==='fight'){ drawStage(); drawDrops(); drawNap(G.fighters[1]); drawBaby(G.fighters[0]); drawProjs(); drawFx(); drawVignette(); drawHUD(); drawMsgs(); drawBlink(); if(G.showMoves)drawMovesOverlay(G.fighters[0].ch); }
  else if(G.scene==='delay')drawDelay();
  else if(G.scene==='whoopsie')drawWhoopsie();
  else if(G.scene==='sandman')drawSandmanScene();
  else if(G.scene==='goodnight')drawGoodnight();
  else if(G.scene==='result')drawResult();
  ctx.restore();
  if(muted)text('MUTED',316,172,'#8f84a6',5,'right');
  mosaic();
}
const MC=document.createElement('canvas');
function mosaic(){ if(RM||G.mos<=0)return; const b=Math.max(1,Math.round(1+11*G.mos/MOS)); if(b<2)return;
  const w=Math.ceil(640/b),h=Math.ceil(360/b); MC.width=w; MC.height=h; const m=MC.getContext('2d'); m.imageSmoothingEnabled=false; m.drawImage(cv,0,0,w,h);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false; ctx.drawImage(MC,0,0,w,h,0,0,w*b,h*b); ctx.restore(); }
if(document.fonts)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(frame);
})();
</script>
